# Included from the nginx http context; define this zone only once.
limit_req_zone $binary_remote_addr zone=undery_auth:1m rate=6r/m;

# Review and nginx -t before installation. This is not applied automatically.
# HTTP and www root requests preserve the path/query at the canonical HTTPS host.
server {
    listen 80;
    listen [::]:80;
    server_name undery.link www.undery.link;
    location = / { return 308 https://undery.link$request_uri; }
    location = /sitemap.xml { return 308 https://undery.link$request_uri; }
    location = /index { return 404; }
    location = /index.html { return 404; }
    location ~ ^/(coding|game|whoami)(/|$) { return 308 https://undery.link$request_uri; }
    location ~ ^/(privacy|admin)(/|$) { return 308 https://undery.link$request_uri; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.undery.link;
    ssl_certificate /etc/letsencrypt/live/undery.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/undery.link/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = / { return 308 https://undery.link$request_uri; }
    location = /sitemap.xml { return 308 https://undery.link$request_uri; }
    location = /index { return 404; }
    location = /index.html { return 404; }
    location ~ ^/(coding|game|whoami)(/|$) { return 308 https://undery.link$request_uri; }
    location ~ ^/(privacy|admin)(/|$) { return 308 https://undery.link$request_uri; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name undery.link;
    ssl_certificate /etc/letsencrypt/live/undery.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/undery.link/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    location = /index { return 404; }
    location = /index.html { return 404; }
    # GitHub callback query strings contain short-lived codes: do not access-log them.
    location ^~ /api/auth/ {
        access_log off;
        limit_req zone=undery_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host undery.link;
        proxy_set_header X-Forwarded-Host undery.link;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location ^~ /api/admin/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host undery.link;
        proxy_set_header X-Forwarded-Host undery.link;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host undery.link;
        proxy_set_header X-Forwarded-Host undery.link;
        proxy_set_header X-Forwarded-Proto https;
        # Replace untrusted incoming forwarding headers at the only public edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
